<!doctype html>
<html lang="pt-BR">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">

  <meta name="theme-color" content="#100d22">
  <meta name="description" content="Sacro Cifras 2.0 — cifras, músicas e repertórios para louvor e adoração.">

  <link rel="manifest" href="./manifest.webmanifest">
  <link rel="icon" type="image/png" sizes="192x192" href="./icons/icon-192.png">
  <link rel="apple-touch-icon" href="./icons/icon-192.png">

  <title>Sacro Cifras 2.0</title>

  <style>
    /* =========================================
       CONFIGURAÇÕES GERAIS
    ========================================= */

    * {
      box-sizing: border-box;
    }

    html,
    body {
      margin: 0;
      width: 100%;
      height: 100%;
      overflow: hidden;
      background: #100d22;
      font-family: Arial, sans-serif;
    }

    /* =========================================
       CONTAINER PRINCIPAL
    ========================================= */

    #app {
      position: fixed;
      inset: 0;
      width: 100%;
      height: 100%;
      background: #100d22;
    }

    /* =========================================
       SISTEMA SACRO CIFRAS
    ========================================= */

    iframe {
      display: block;
      width: 100%;
      height: 100%;
      border: 0;
      background: #100d22;
    }
  </style>
</head>

<body>

  <!-- =========================================
       APLICAÇÃO PRINCIPAL
  ========================================== -->

  <main id="app">

    <iframe
      src="https://script.google.com/macros/s/AKfycbyG90u6fEOrBVwahmJtLY8WM9eyaMjPzKIiY_TtFWE3h9OWHNLP1QyW9J-J6ckpjQPY/exec"
      title="Sacro Cifras 2.0"
      allow="clipboard-read; clipboard-write; fullscreen"
      allowfullscreen>
    </iframe>

  </main>

  <!-- =========================================
       SERVICE WORKER
  ========================================== -->

  <script>
    if ('serviceWorker' in navigator) {

      window.addEventListener('load', () => {

        navigator.serviceWorker
          .register('./sw.js')
          .catch(err => {
            console.warn('Service Worker:', err);
          });

      });

    }
  </script>

</body>
</html>
