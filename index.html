<!doctype html>
<html lang="pt-BR">
<head>
  <meta charset="utf-8">

  <meta name="theme-color" content="#100d22">
  <meta name="description" content="Sacro Cifras 2.0 — cifras, músicas e repertórios para louvor e adoração.">
  <link rel="manifest" href="./manifest.webmanifest">
  <link rel="icon" type="image/png" sizes="192x192" href="./icons/icon-192.png">
  <link rel="apple-touch-icon" href="./icons/icon-192.png">
  <title>Sacro Cifras 2.0</title>
  <style>
    * { box-sizing: border-box; }
    html, body { margin: 0; width: 100%; height: 100%; overflow: hidden; background: #100d22; font-family: Arial, sans-serif; }
    #app { position: fixed; inset: 0; background: #100d22; }
    iframe { display: block; width: 100%; height: 100%; border: 0; background: #100d22; }
    #fallback { position: fixed; z-index: 10; left: 50%; bottom: max(18px, env(safe-area-inset-bottom)); transform: translateX(-50%); padding: 11px 17px; border: 1px solid rgba(233,199,119,.55); border-radius: 24px; background: rgba(16,13,34,.92); color: #f5dda2; font-size: 13px; text-decoration: none; white-space: nowrap; }
  </style>
</head>
<body>
  <main id="app">
    <iframe
      src="https://script.google.com/macros/s/AKfycbyG90u6fEOrBVwahmJtLY8WM9eyaMjPzKIiY_TtFWE3h9OWHNLP1QyW9J-J6ckpjQPY/exec"
      title="Sacro Cifras 2.0"
      allow="clipboard-read; clipboard-write; fullscreen"
      allowfullscreen>
    </iframe>
  </main>
  <a id="fallback" href="https://script.google.com/macros/s/AKfycbyG90u6fEOrBVwahmJtLY8WM9eyaMjPzKIiY_TtFWE3h9OWHNLP1QyW9J-J6ckpjQPY/exec" target="_blank" rel="noopener">Problemas para abrir? Toque aqui</a>
  <script>
    if ('serviceWorker' in navigator) {
      window.addEventListener('load', () => {
        navigator.serviceWorker.register('./sw.js').catch(err => console.warn('Service Worker:', err));
      });
    }
  </script>
</body>
</html>
